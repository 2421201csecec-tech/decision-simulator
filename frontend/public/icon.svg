    @media (prefers-color-scheme: light) { .bg { fill: #f0ece6; } }
  </style>
  <rect class="bg" width="40" height="40" rx="8"/>
  <circle
    cx="20"
    cy="20"
    r="13"
    stroke="url(#g)"
